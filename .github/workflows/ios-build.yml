name: Build iOS (sin firmar)
on:
  workflow_dispatch:
  push:
    paths:
      - 'fortshop-ios.zip'
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto iOS
        run: |
          rm -rf ios-src && mkdir ios-src
          unzip -q fortshop-ios.zip -d ios-src
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Generar proyecto y compilar
        working-directory: ios-src
        run: |
          xcodegen generate
          xcodebuild -project FortShop.xcodeproj -scheme FortShop -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Crear IPA
        working-directory: ios-src
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/FortShop.app Payload/
          zip -qr FortShop-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FortShop-ios-unsigned
          path: ios-src/FortShop-unsigned.ipa
